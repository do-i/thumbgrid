name: macOS package

# Build a macOS app bundle, package it as a DMG, and attach it to the GitHub
# release whenever a version tag is pushed.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write   # needed to upload assets to the release

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Install build tooling
        run: brew install cmake ninja qt opencv exiv2 mpv pkg-config create-dmg extra-cmake-modules libheif

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # tags needed for git describe / appversion
          lfs: true        # fetch real image bytes; LFS pointer stubs in qrc crash at runtime

      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Export Homebrew build paths
        run: |
          qt_prefix="$(brew --prefix qt)"
          opencv_prefix="$(brew --prefix opencv)"
          echo "$qt_prefix/bin" >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=$qt_prefix;$opencv_prefix" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$(brew --prefix exiv2)/lib/pkgconfig:$(brew --prefix mpv)/lib/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH"

      - name: Build
        run: cmake --build build

      - name: Copy player plugin into app bundle
        run: |
          mkdir -p build/src/thumbgrid.app/Contents/lib/thumbgrid
          cp build/lib/thumbgrid/player_mpv.so build/src/thumbgrid.app/Contents/lib/thumbgrid/

      # heif/heic decoding is not part of Qt; it comes from KDE's kimageformats
      # plugin, which Homebrew does not package, so it is built here against the
      # same Qt the app links. Only the heif plugin is kept - the rest of
      # kimageformats' codecs are not installed, so cmake skips them.
      - name: Build heif image plugin
        run: |
          # kimageformats hard-requires an ECM of at least its own release
          # version - find_package(ECM <that exact version>) at the top of its
          # CMakeLists - and the two ship together in one KDE Frameworks
          # release. Homebrew's extra-cmake-modules trails the newest KDE tag by
          # a release often enough that pinning a version here breaks the build
          # the moment the two drift apart, so build the kimageformats that
          # matches whatever ECM brew actually installed.
          # Read it out of the very file find_package(ECM) consults, rather
          # than from brew's formula version - that is the number the version
          # check will actually compare against.
          ecm_version_file="$(brew --prefix extra-cmake-modules)/share/ECM/cmake/ECMConfigVersion.cmake"
          version="$(sed -n 's/^set(PACKAGE_VERSION "\(.*\)")$/\1/p' "$ecm_version_file")"
          if [[ -z "$version" ]]; then
            echo "::error::Could not read the installed ECM version from $ecm_version_file"
            exit 1
          fi
          echo "Building kimageformats ${version} to match the installed extra-cmake-modules"
          if ! curl -fsSL -o kimageformats.tar.gz \
            "https://github.com/KDE/kimageformats/archive/refs/tags/v${version}.tar.gz"; then
            echo "::error::No kimageformats release tagged v${version} to pair with the installed extra-cmake-modules"
            exit 1
          fi
          tar xf kimageformats.tar.gz
          # KIMAGEFORMATS_HEIF defaults to OFF upstream, and libheif is only
          # probed inside that option's if(), so without it LibHeif_FOUND stays
          # unset and the kimg_heif target is never created at all.
          cmake -S "kimageformats-${version}" -B kif-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt);$(brew --prefix extra-cmake-modules)" \
            -DKIMAGEFORMATS_HEIF=ON \
            -DBUILD_TESTING=OFF
          cmake --build kif-build --target kimg_heif

      # Must land before macdeployqt: the deploy step is what walks the bundle's
      # plugins and pulls their dylib dependencies (libheif and its codecs) into
      # Contents/Frameworks. A plugin copied in afterwards would ship with
      # unresolved @rpath references and fail to load.
      - name: Copy heif image plugin into app bundle
        run: |
          app="build/src/thumbgrid.app"
          mkdir -p "$app/Contents/PlugIns/imageformats"
          plugin="$(find kif-build -name 'kimg_heif.*' -type f | head -1)"
          if [[ -z "$plugin" ]]; then
            echo "::error::kimg_heif was not built - refusing to ship a bundle without heic support"
            exit 1
          fi
          cp "$plugin" "$app/Contents/PlugIns/imageformats/"

      - name: Deploy Qt runtime
        run: macdeployqt build/src/thumbgrid.app -verbose=2

      - name: Fix bundled library references
        run: |
          app="build/src/thumbgrid.app"
          frameworks="$app/Contents/Frameworks"

          while IFS= read -r binary; do
            file "$binary" | grep -q 'Mach-O' || continue

            otool -L "$binary" | awk '/@rpath\/lib/ { print $1 }' | while read -r dependency; do
              library_name="${dependency##*/}"
              [[ -e "$frameworks/$library_name" ]] || continue

              case "$binary" in
                "$frameworks"/*)
                  replacement="@loader_path/$library_name"
                  ;;
                *)
                  replacement="@executable_path/../Frameworks/$library_name"
                  ;;
              esac

              install_name_tool -change "$dependency" "$replacement" "$binary"
            done
          done < <(find "$app/Contents" -type f)

      - name: Sign app bundle
        run: |
          codesign --force --deep --sign - build/src/thumbgrid.app
          codesign --verify --deep --strict --verbose=2 build/src/thumbgrid.app

      - name: Create DMG
        run: |
          dmg_name="thumbgrid-macos-${GITHUB_REF_NAME}.dmg"
          mkdir -p build/dmg
          cp -R build/src/thumbgrid.app build/dmg/
          create-dmg \
            --volname "thumbgrid ${GITHUB_REF_NAME}" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "thumbgrid.app" 175 120 \
            --hide-extension "thumbgrid.app" \
            --app-drop-link 425 120 \
            "$dmg_name" \
            build/dmg/

      - name: Upload DMG to the release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: thumbgrid-macos-${{ github.ref_name }}.dmg
          fail_on_unmatched_files: true
          generate_release_notes: true
