name: msys2 dev-latest
on: [workflow_dispatch]
#on:
#  push:
#    branches:
#      - dev
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MINGW64
          update: true
          install: git p7zip

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          #ref: dev
          fetch-depth: 0
          lfs: true        # fetch real image bytes; LFS pointer stubs in qrc crash at runtime

      - id: build
        name: CI-Build
        run: |
          export BUILD_NAME="thumbgrid-x64_$(git describe --tags)"
          echo "build_name=${BUILD_NAME}" >> $GITHUB_OUTPUT
          echo "build_file_name=${BUILD_NAME}.7z" >> $GITHUB_OUTPUT
          ./scripts/build-thumbgrid.sh
          pwd
          ls -al
          echo "running: 7z a thumbgrid-x64.7z ./${BUILD_NAME}"
          7z a thumbgrid-x64.7z ./${BUILD_NAME}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thumbgrid-build
          path: thumbgrid-x64.7z

    outputs:
       build_name: ${{ steps.build.outputs.build_name }}
       build_file_name: ${{ steps.build.outputs.build_file_name }}

  upload-release:
    runs-on: ubuntu-latest
    needs: build
    steps:
       #- run: echo "${{ needs.build.outputs.build_name }}"
       - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
         with:
           name: thumbgrid-build

       - name: Rename archive
         run: mv thumbgrid-x64.7z "${{ needs.build.outputs.build_file_name }}"

       - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
         #if: startsWith(github.ref, 'refs/tags/')
         with:
           files: ${{ needs.build.outputs.build_file_name }}
           prerelease: true
           tag_name: latest-dev
           name: ${{ needs.build.outputs.build_name }}
           body: "Automated build"
