name: Tests

# Build with testing enabled and run the CTest behavior suite on Linux.
on:
  push:
    branches:
      - develop
  pull_request:
  workflow_dispatch: {}

jobs:
  ctest:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Install build tooling
        run: pacman -Syu --noconfirm git git-lfs cmake qt6-base qt6-svg qt6-imageformats qt6-tools pkgconf exiv2 opencv mpv

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # tags needed for git describe / appversion
          lfs: true        # fetch real image bytes; LFS pointer stubs in qrc crash at runtime

      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Steps in a container run as root, and root bypasses file permission
      # bits: a mode 0400 file still reports as writable. Behavior tests that
      # assert the UI greys out editing for a read-only file therefore fail as
      # root while passing everywhere else. Build and test as an unprivileged
      # user so permissions mean what they mean for a real user. The same
      # trick, for the same reason, is in packaging-checks.yml.
      - name: Create unprivileged build user
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Configure
        run: sudo -u builder -H cmake -S . -B build -DBUILD_TESTING=ON

      - name: Build tests
        run: sudo -u builder -H cmake --build build --target thumbgrid_behavior_tests_all -j"$(nproc)"

      # sudo scrubs the environment, so the job-level QT_QPA_PLATFORM does not
      # survive into the test run; pass it through explicitly.
      - name: Run tests
        run: sudo -u builder -H env QT_QPA_PLATFORM=offscreen ctest --test-dir build --output-on-failure
