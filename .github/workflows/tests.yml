name: Tests

# Run the behavior suite on Linux and the move tests on macOS.
on:
  push:
    branches:
      - develop
  pull_request:
  workflow_dispatch: {}

jobs:
  ctest:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Install build tooling
        run: pacman -Syu --noconfirm git git-lfs cmake qt6-base qt6-svg qt6-imageformats kimageformats libheif qt6-tools pkgconf exiv2 mpv

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # tags needed for git describe / appversion
          lfs: true        # fetch real image bytes; LFS pointer stubs in qrc crash at runtime

      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # An image committed without the LFS filter active is stored as a raw
      # blob; every LFS checkout then shows it modified, and release builds
      # report their version as "<tag>-dirty". Fail at commit time instead.
      - name: Check images are committed as LFS pointers
        run: git lfs fsck --pointers

      # Steps in a container run as root, and root bypasses file permission
      # bits: a mode 0400 file still reports as writable. Behavior tests that
      # assert the UI greys out editing for a read-only file therefore fail as
      # root while passing everywhere else. Build and test as an unprivileged
      # user so permissions mean what they mean for a real user. The same
      # trick, for the same reason, is in packaging-checks.yml.
      - name: Create unprivileged build user
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Configure
        run: sudo -u builder -H cmake -S . -B build -DBUILD_TESTING=ON

      - name: Build tests
        run: sudo -u builder -H cmake --build build --target thumbgrid_behavior_tests_all -j"$(nproc)"

      # sudo scrubs the environment, so the job-level QT_QPA_PLATFORM does not
      # survive into the test run; pass it through explicitly.
      - name: Run tests
        run: sudo -u builder -H env QT_QPA_PLATFORM=offscreen ctest --test-dir build --output-on-failure

  macos-move:
    runs-on: macos-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Install build tooling
        run: brew install cmake ninja qt exiv2 mpv pkg-config extra-cmake-modules libheif

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: true

      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Export Homebrew build paths
        run: |
          qt_prefix="$(brew --prefix qt)"
          echo "$qt_prefix/bin" >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=$qt_prefix" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$(brew --prefix exiv2)/lib/pkgconfig:$(brew --prefix mpv)/lib/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH" -DBUILD_TESTING=ON

      - name: Build app and move tests
        run: cmake --build build --target thumbgrid player_mpv thumbgrid_moving_a_folder_renames_it_test thumbgrid_file_move_safety_test

      - name: Create a separate filesystem for move tests
        run: |
          image="$RUNNER_TEMP/thumbgrid-move-tests.dmg"
          mountpoint="$RUNNER_TEMP/thumbgrid-cross-fs"
          mkdir -p "$mountpoint"
          hdiutil create -size 256m -fs APFS -volname ThumbgridMoveTests "$image"
          hdiutil attach -nobrowse -mountpoint "$mountpoint" "$image"
          echo "THUMBGRID_TEST_CROSS_FS_DIR=$mountpoint" >> "$GITHUB_ENV"

      - name: Run folder move test
        run: ctest --test-dir build --output-on-failure --verbose --no-tests=error -R '^Moving a folder within one filesystem renames it instead of copying$'

      - name: Run file move safety test
        run: ctest --test-dir build --output-on-failure --verbose --no-tests=error -R '^File moves preserve data and never clobber destinations$'

      - name: Detach move test filesystem
        if: always()
        run: |
          mountpoint="$RUNNER_TEMP/thumbgrid-cross-fs"
          if mount | grep -F " on $mountpoint (" >/dev/null; then
            hdiutil detach "$mountpoint"
          fi
